<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PulseApp">
    
    <!-- Apple Touch Icons -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="stylesheet" href="/styles.css">

    <title>PulseApp - Ежедневные комплименты</title>
</head>
<body>
    <div class="container">
        <main>
            <div class="card">
                <div id="status-message" class="status">
                    <span class="status-icon">⏳</span>
                    <span class="status-text">Инициализация...</span>
                </div>
                
                <button id="subscribe-btn" class="btn-primary">
                    Подписаться на уведомления
                </button>
                
                <div id="error-message" class="error-message hidden"></div>
            </div>
        </main>
    </div>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
</body>
</html>
