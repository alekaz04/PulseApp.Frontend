# Nginx конфигурация для PulseApp PWA
# Оптимизирована для статического контента и Service Workers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Производительность
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (основной reverse proxy должен добавить HTTPS-специфичные)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # PWA: Service Worker должен иметь правильный Content-Type и НЕ кэшироваться
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Service-Worker-Allowed "/" always;
            types {
                application/javascript js;
            }
        }

        # PWA: Manifest.json должен иметь правильный Content-Type
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600" always;
            types {
                application/manifest+json json;
            }
        }

        # Статические ресурсы (JS, CSS) - кэшируем на 1 день
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Иконки и изображения - кэшируем на 7 дней
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            add_header Cache-Control "public, max-age=604800" always;
        }

        # Fonts - кэшируем на 1 год
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000" always;
        }

        # Главная страница и HTML - минимальное кэширование
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # SPA routing: все несуществующие маршруты перенаправляем на index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Отключаем логирование для favicon
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # Запрещаем доступ к скрытым файлам
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
